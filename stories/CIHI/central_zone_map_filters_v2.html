  $("sub").textContent = sub;
  $("ltitle").textContent = rate ? "People ÷ community population" : "Number of people";

  paths.forEach(p => {
    p.n = tables.reduce((s,t) => s + sumTable(t, p.key, g, a0, a1), 0);
    p.hidden = DATA.suppress > 0 && p.n > 0 && p.n < DATA.suppress;
    const denom = DATA.pop[p.key][g];
    p.v = rate ? (denom ? p.n / denom : 0) : p.n;
  });
  const vmax = Math.max(rate ? 0.0001 : 1, ...paths.filter(p => !p.hidden).map(p => p.v));
  $("lmax").textContent = fmt(vmax, rate);
  paths.forEach(p => p.el.setAttribute("fill", p.hidden ? "#d9d9d9" : colour(p.v/vmax)));
  paths.forEach(p => p.rate = rate);
}
["view","condition","rule","cnt","gender","ageFrom","ageTo","measure"].forEach(id =>
  $(id).addEventListener("input", () => update(id)));

// ---- tooltip ----
const tip = $("tip");
paths.forEach(p => {
  p.el.addEventListener("mousemove", e => {
    tip.style.display = "block";
    tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px";
    let txt;
    if(p.hidden) txt = "<" + DATA.suppress;
    else if(p.rate) txt = fmt(p.v, true) + " (n = " + p.n + ")";
    else txt = p.n;
    tip.textContent = p.name + ": " + txt;
  });
  p.el.addEventListener("mouseleave", () => tip.style.display = "none");
});
update();
</script></body></html>
