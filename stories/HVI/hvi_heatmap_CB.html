<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova Scotia Heat Vulnerability Index</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2b2b26;
        background: #fbfaf7;
      }

      * { box-sizing: border-box; } 
      body { margin: 0; min-height: 100vh; padding: 28px 20px; }
      main { max-width: 1520px; margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 18px; }
      h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
      .legend-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
      .legend { display: flex; flex-wrap: wrap; gap: 18px 22px; font-size: 12px; }
      .legend-item { display: flex; align-items: center; gap: 6px; }
      .legend-label { color: #4a4a42; font-weight: 600; }
      .swatches { display: flex; overflow: hidden; border: 1px solid #e3e0d5; border-radius: 4px; }
      .swatch { width: 16px; height: 14px; }
      .legend-direction { color: #9a9688; }
      .status { display: none; margin-bottom: 16px; padding: 14px 16px; background: #fff; border: 1px solid #e3e0d5; border-radius: 8px; color: #6b6b60; font-size: 13px; line-height: 1.55; }
      .status.visible { display: block; }
      .status.error { color: #b8331a; }
      .colorblind-toggle {
        display: inline-flex; align-items: center;
        font-size: 12.5px; font-weight: 600; color: #4a4a42;
        padding: 6px 14px; border-radius: 20px;
        border: 1px solid #d8d5cb; background: #fff; cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .colorblind-toggle:hover { background: #f4f2ea; }
      .colorblind-toggle.active { background: #2c7bb6; border-color: #2c7bb6; color: #fff; }

      .table-wrap { display: none; overflow-x: auto; background: #fff; border: 1px solid #e3e0d5; border-radius: 10px; }
      .table-wrap.visible { display: block; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      thead th { height: 148px; padding: 7px 4px; background: #f4f2ea; border-bottom: 2px solid #e3e0d5; font-size: 12.5px; font-weight: 700; color: #6b6b60; text-align: center; vertical-align: bottom; cursor: pointer; user-select: none; }
      thead th.active { color: #2b2b26; }
      thead th.sticky { position: sticky; z-index: 3; padding: 8px 10px; white-space: nowrap; }
      th.name-column { left: 0; width: 210px; min-width: 210px; max-width: 210px; text-align: left; }
      th.measure-column { width: 46px; min-width: 46px; max-width: 46px; }
      th.summary-column { width: 72px; min-width: 72px; max-width: 72px; }
      .vertical-label { display: inline-block; max-height: 130px; writing-mode: vertical-rl; transform: rotate(180deg); }
      .sort-arrow { margin-left: 3px; font-size: 10px; }
      tbody tr:nth-child(odd) { background: #fff; }
      tbody tr:nth-child(even) { background: #fcfbf8; }
      tbody td.sticky { position: sticky; z-index: 1; padding: 6px 10px; background: inherit; font-size: 13px; white-space: nowrap; }
      td.name-column { left: 0; border-right: 1px solid #e3e0d5; font-weight: 500; font-size: 14px; text-align: left; }
      td.heat-cell { height: 29px; border: 1px solid rgba(255, 255, 255, 0.6); font-size: 12px; text-align: center; transition: outline 0.1s; }
      td.heat-cell:hover { position: relative; z-index: 1; outline: 2px solid #2b2b26; outline-offset: -2px; }

      @media (max-width: 680px) {
        body { padding: 20px 12px; }
        h1 { font-size: 19px; }
        .legend { gap: 12px 15px; }
      }

      /* ---------- Layout with profile side panel ---------- */
      .layout { display: flex; align-items: flex-start; gap: 20px; max-width: 1520px; margin: 0 auto; }
      .layout main { flex: 1 1 auto; min-width: 0; margin: 0; max-width: none; transition: flex-basis 0.25s ease; }

      .profile-panel {
        flex: 0 0 0px;
        width: 0;
        overflow: hidden;
        opacity: 0;
        background: #fff;
        border: 1px solid #e3e0d5;
        border-radius: 10px;
        transition: flex-basis 0.25s ease, width 0.25s ease, opacity 0.2s ease;
        align-self: flex-start;
        position: sticky;
        top: 20px;
      }
      .profile-panel.open {
        flex: 0 0 380px;
        width: 380px;
        opacity: 1;
      }
      .profile-panel-inner { padding: 20px; width: 380px; }

      .profile-close {
        position: absolute; top: 12px; right: 12px;
        border: none; background: #f4f2ea; color: #6b6b60;
        width: 26px; height: 26px; border-radius: 50%;
        cursor: pointer; font-size: 14px; line-height: 1;
      }
      .profile-close:hover { background: #e9e6dc; color: #2b2b26; }

      .profile-header { padding-right: 30px; }
      .profile-name { font-size: 19px; font-weight: 700; margin: 2px 0 2px; letter-spacing: -0.01em; }
      .profile-hvi-badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 600; margin-top: 4px;
        padding: 3px 10px; border-radius: 20px;
      }

      .profile-map {
        margin: 14px 0; border-radius: 8px; overflow: hidden;
        border: 1px solid #e3e0d5; background: #eef2f0;
      }
      .profile-map svg { display: block; width: 100%; height: auto; }

      .profile-section-title {
        font-size: 10.5px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.05em; color: #9a9688; margin: 18px 0 8px;
      }

      .profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
      .stat-box-emphasis { grid-column: 1 / -1; background: #fdf3e4; border-color: #f0d9ae; }
      .stat-box-emphasis .stat-label { color: #a06a1a; }
      .stat-box-emphasis .stat-value { font-size: 20px; color: #8a4f0d; }
      .stat-box { padding: 8px 10px; background: #fbfaf7; border: 1px solid #eeece3; border-radius: 7px; }
      .stat-label { font-size: 10px; color: #9a9688; font-weight: 600; }
      .stat-value { font-size: 14px; font-weight: 700; color: #2b2b26; margin-top: 2px; }
      .stat-unit { font-size: 10.5px; font-weight: 500; color: #6b6b60; margin-left: 2px; }

      .profile-subindex-list { display: flex; flex-direction: column; gap: 5px; }
      .subindex-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
      .subindex-name { flex: 1 1 auto; color: #4a4a42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .subindex-track { flex: 0 0 90px; height: 7px; border-radius: 4px; background: #eeece3; overflow: hidden; }
      .subindex-fill { height: 100%; border-radius: 4px; }
      .subindex-val { flex: 0 0 30px; text-align: right; color: #6b6b60; font-variant-numeric: tabular-nums; }

      .profile-category-heading { font-size: 10px; font-weight: 700; color: #6b6b60; margin: 10px 0 4px; }

      .profile-footnote { font-size: 10px; color: #b2ae9f; margin-top: 16px; line-height: 1.5; }

      .print-profile-btn {
        margin-top: 16px; width: 100%; padding: 9px 12px;
        border-radius: 7px; border: 1px solid #d8d5cb; background: #f4f2ea;
        color: #4a4a42; font-weight: 600; font-size: 12.5px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .print-profile-btn:hover { background: #efece2; }

      tbody td.name-column { cursor: pointer; }
      tbody td.name-column:hover { text-decoration: underline; text-decoration-color: #c9c5b7; }
      tbody tr.row-selected td.sticky { background: #fbf3df !important; }

      /* ---------- Printable community profile ---------- */
      #print-root { display: none; }

      @media print {
        html, body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          color-adjust: exact;
          margin: 0;
          padding: 0;
          min-height: auto;
        }
        #print-root *, #print-root {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          color-adjust: exact;
        }
        .layout { display: none !important; }
        #print-root {
          display: block;
          position: static;
          width: auto;
          padding: 0;
        }
        .print-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #2b2b26; padding-bottom: 10px; margin-bottom: 14px; }
        .print-header h1 { font-size: 20px; margin: 0; }
        .print-header .print-id { font-size: 12px; color: #6b6b60; }
        .print-meta { font-size: 11px; color: #6b6b60; margin-bottom: 16px; }
        .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .print-map-box svg { width: 100%; height: auto; border: 1px solid #ccc; border-radius: 6px; }
        .print-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 10px; }
        .print-stat { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; }
        .print-stat .stat-label { font-size: 9px; }
        .print-stat .stat-value { font-size: 13px; }
        .print-stat-emphasis { grid-column: 1 / -1; border-color: #e0b060; background: #fdf3e4; }
        .print-stat-emphasis .stat-value { font-size: 18px; }
        .print-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #444; margin: 16px 0 6px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
        .print-subindex-list { column-count: 2; column-gap: 20px; }
        .print-subindex-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; break-inside: avoid; padding: 2px 0; }
        .print-subindex-row .subindex-name { flex: 1 1 auto; }
        .print-subindex-row .subindex-track { flex: 0 0 70px; height: 6px; border: 1px solid #ccc; overflow: hidden; }
        .print-subindex-row .subindex-val { flex: 0 0 32px; text-align: right; }
        .print-footer { margin-top: 20px; font-size: 9.5px; color: #888; }
        @page { size: portrait; margin: 12mm; }
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <main>
        <header>
          <h1>Nova Scotia Heat Vulnerability Index (HVI)</h1>
        </header>

        <div class="legend-row">
          <section class="legend" id="legend" aria-label="Heatmap color legend"></section>
          <button
            type="button"
            class="colorblind-toggle"
            id="colorblind-toggle"
            title="Switch to a colorblind-friendly palette"
          >
            <span id="colorblind-toggle-label">Colourblind?</span>
          </button>
        </div>
        <p style="font-size: 11.5px; color: #9a9688; margin: 0 0 16px;">*HVI = Normalized HVI</p>
        <div class="status" id="status" role="status"></div>

        <div class="table-wrap" id="table-wrap">
          <table aria-label="Nova Scotia heat vulnerability indicators by community">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </main>

      <aside class="profile-panel" id="profile-panel" aria-label="Community profile">
        <div class="profile-panel-inner" id="profile-panel-inner"></div>
      </aside>
    </div>

    <div id="print-root"></div>

    <script>
      "use strict";

      const DEFAULT_EXCEL_FILE = "HVI_index_sep9.xlsx";
      const DEFAULT_BOUNDARIES_FILE = "community_boundaries.geojson";
      const PROFILE_COLUMNS = ["pop_total_all", "area"];

      const CATEGORIES = [
        {
          key: "exposure",
          label: "Exposure",
          columns: ["Heatwave Score", "Air Quality PM2.5", "Air Quality NO2"],
        },
        {
          key: "sensitivity",
          label: "Sensitivity",
          columns: [
            "Age < 9 yrs",
            "Age > 65 yrs",
            "Indigenous",
            "African NS",
            "Active Transport",
            "Outdoor Workers",
            "% of population on life-sustaining care",
            "% Multimorbidity",
          ],
        },
        {
          key: "adaptive",
          label: "Adaptive Capacity",
          columns: [
            "EHS Response",
            "Material Security",
            "Social Connectivity",
            "Social Diversity",
            "Green Space",
            "Blue Space",
          ],
        },
        {
          key: "hvi-normalized",
          label: "HVI*",
          columns: ["Normalized HVI"],
        },
      ];

      // Two selectable palettes, keyed by category key. Each defines the
      // 5-shade ramp, the header accent color, and the band index (if any)
      // at which text should switch to white for contrast.
      const PALETTES = {
        original: {
          name: "Original",
          categoryColors: {
            sensitivity: "yellow",
            exposure: "red",
            adaptive: "green",
            "hvi-normalized": "orange",
          },
          ramps: {
            yellow: ["#fff1ad", "#ffe582", "#ffd64d", "#f4c430", "#c9930a"],
            red: ["#ffd9d1", "#ffb6a7", "#f28d75", "#e35d3f", "#b8331a"],
            green: ["#dbeed7", "#bde0b6", "#90ca88", "#5bab5c", "#357a37"],
            orange: ["#ffe4bf", "#ffd090", "#ffb45b", "#f5891f", "#c2600a"],
          },
          accentLines: {
            yellow: "#e0c34a",
            red: "#e07a5f",
            green: "#7aac6e",
            orange: "#f0a24a",
          },
          whiteTextFromBand: {
            yellow: null,
            red: 3,
            green: 3,
            orange: 3,
          },
        },
        colorblind: {
          name: "Colorblind-friendly",
          categoryColors: {
            sensitivity: "orange",
            exposure: "red",
            adaptive: "lightblue",
            "hvi-normalized": "darkblue",
          },
          // Colorblind-safe palette (ColorBrewer RdYlBu-family anchors), each
          // extended into a 5-shade light-to-dark ramp for the heatmap bands.
          ramps: {
            red: ["#f9dadb", "#f1acad", "#e87a7b", "#df4749", "#d7191c"],
            orange: ["#fff2e6", "#fee2c6", "#fed0a3", "#fdbe81", "#fdae61"],
            lightblue: ["#f2f9fb", "#e1f1f7", "#cee9f2", "#bce1ed", "#abd9e9"],
            darkblue: ["#ddeaf3", "#b3cfe5", "#85b2d5", "#5695c5", "#2c7bb6"],
          },
          accentLines: {
            red: "#d7191c",
            orange: "#fdae61",
            lightblue: "#abd9e9",
            darkblue: "#2c7bb6",
          },
          // Band index (0-4) at which a ramp becomes dark enough that white
          // text reads better than dark text. Only "red" and "darkblue" get
          // dark enough in this palette to need the swap.
          whiteTextFromBand: {
            red: 3,
            orange: null,
            lightblue: null,
            darkblue: 4,
          },
        },
      };

      function getActivePalette() {
        return PALETTES[state.paletteId] || PALETTES.original;
      }

      function getCategoryColor(categoryKey) {
        return getActivePalette().categoryColors[categoryKey];
      }

      const ALL_COLUMNS = CATEGORIES.flatMap((category) =>
        category.columns.map((column) => ({
          column,
          categoryKey: category.key,
          label: column === "Normalized HVI" ? "HVI*" : column,
        })),
      );

      const SUMMARY_COLUMNS = new Set(["Normalized HVI"]);

      // Approximate community locations within Nova Scotia (placeholder — update with real
      // boundary data later). Lng/lat roughly cover NS's bounding box: lng -66.4..-59.8, lat 43.4..47.05
      const COMMUNITY_COORDS = {
        10101: [44.3781, -64.5199], 10102: [44.5410, -64.2372], 10103: [44.0410, -64.7150],
        10104: [44.3781, -64.3105], 10205: [44.6224, -65.7583], 10206: [43.7627, -65.3200],
        10207: [43.8375, -66.1174], 10308: [44.7440, -65.5136], 10309: [45.0524, -64.7472],
        10310: [45.0778, -64.4966], 10311: [44.9548, -65.0722], 10312: [45.0803, -64.3644],
        20413: [44.9367, -63.6558], 20414: [45.4270, -63.9106], 20415: [45.2000, -63.8333],
        20416: [45.3020, -63.2680], 20417: [45.3670, -63.2820], 20518: [45.8168, -64.2115],
        20519: [45.7333, -64.0000], 20520: [45.6167, -63.9333], 20521: [45.6516, -64.0596],
        20622: [45.5551, -62.6438], 20623: [45.6784, -62.7078], 30724: [45.6198, -61.9975],
        30725: [45.3833, -61.5000], 30726: [45.1333, -61.9667], 30827: [45.6167, -61.3500],
        30828: [46.1000, -60.7833], 30829: [46.6392, -61.0043], 30830: [46.9000, -60.4500],
        30831: [46.2333, -61.3000], 30932: [46.2500, -60.0833], 30933: [46.1368, -60.1942],
        30934: [46.2001, -59.9581], 30935: [46.2000, -60.2500], 41036: [44.6900, -63.5900],
        41037: [44.6650, -63.5700], 41038: [44.6800, -63.5300], 41039: [44.6392, -63.4620],
        41040: [44.7200, -63.3800], 41141: [44.7280, -63.8130], 41142: [44.5000, -63.6167],
        41143: [44.6167, -63.6333], 41144: [44.6470, -63.6000], 41145: [44.6390, -63.6100],
        41146: [44.6570, -63.6260], 41147: [44.6660, -63.6440], 41148: [44.6450, -63.5820],
        41249: [44.7325, -63.6800], 41250: [44.7833, -63.6833], 41251: [44.8100, -63.6900],
        41252: [44.7667, -63.5833], 41353: [44.8000, -63.0000], 41454: [44.9500, -64.1500],
      };

      const NS_BOUNDS = { minLat: 43.35, maxLat: 47.05, minLng: -66.4, maxLng: -59.75 };

      const state = {
        rows: [],
        domains: {},
        sortColumn: null,
        sortDirection: "desc",
        selectedId: null,
        boundaries: null, // { byId: Map<id, [ [ [lat,lng], ... ], ... ]>, bounds: {minLat,maxLat,minLng,maxLng} }
        paletteId: "original", // "original" | "colorblind"
      };

      const elements = {
        legend: document.getElementById("legend"),
        status: document.getElementById("status"),
        tableWrap: document.getElementById("table-wrap"),
        tableHead: document.getElementById("table-head"),
        tableBody: document.getElementById("table-body"),
        profilePanel: document.getElementById("profile-panel"),
        profilePanelInner: document.getElementById("profile-panel-inner"),
        printRoot: document.getElementById("print-root"),
        colorblindToggle: document.getElementById("colorblind-toggle"),
        colorblindToggleLabel: document.getElementById("colorblind-toggle-label"),
      };

      // ---------- Colorblind-friendly palette toggle ----------
      // Persists the choice locally (best-effort) and re-renders everything
      // that depends on category colors, with no page reload.
      const PALETTE_STORAGE_KEY = "hvi-palette-preference";

      function loadStoredPaletteId() {
        try {
          const stored = window.localStorage.getItem(PALETTE_STORAGE_KEY);
          return stored === "colorblind" ? "colorblind" : "original";
        } catch (error) {
          return "original";
        }
      }

      function storePaletteId(paletteId) {
        try {
          window.localStorage.setItem(PALETTE_STORAGE_KEY, paletteId);
        } catch (error) {
          // Ignore storage failures (e.g. privacy mode) — the toggle still
          // works for the current session either way.
        }
      }

      function updatePaletteToggleUI() {
        const isColorblind = state.paletteId === "colorblind";
        elements.colorblindToggle.classList.toggle("active", isColorblind);
        elements.colorblindToggle.setAttribute("aria-pressed", String(isColorblind));
        elements.colorblindToggle.title = isColorblind
          ? "Switch back to the original color palette"
          : "Switch to a colorblind-friendly palette";
        elements.colorblindToggleLabel.textContent = isColorblind
          ? "Original colours"
          : "Colourblind?";
      }

      function renderColorDependentViews() {
        renderLegend();
        renderTable();
        renderProfilePanel();
      }

      function setPalette(paletteId) {
        state.paletteId = paletteId;
        storePaletteId(paletteId);
        updatePaletteToggleUI();
        renderColorDependentViews();
      }

      elements.colorblindToggle.addEventListener("click", () => {
        setPalette(state.paletteId === "colorblind" ? "original" : "colorblind");
      });

      function formatIndexValue(value) {
        // Sub-index and HVI values are stored on a 0.1–0.9 scale; display them
        // scaled to 10–90 (multiply by 100) without stating the range itself.
        return Number.isFinite(value) ? (value * 100).toFixed(1) : "—";
      }

      function getCommunityStats(row) {
        return {
          population: row.pop_total_all,
          areaKm2: row.area,
        };
      }

      function formatPopulation(value) {
        return Number.isFinite(value) ? Math.round(value).toLocaleString() : "N/A";
      }

      function formatArea(value) {
        // return Number.isFinite(value)
        //   ? value.toLocaleString(undefined, { maximumFractionDigits: 2 })
        //   : "N/A";
        return Number.isFinite(value)
          ? Math.round(value).toLocaleString()
          : "N/A";
      }

      // ---------- Real community boundaries (optional GeoJSON) ----------
      // If community_boundaries.geojson is present (see convert_boundaries.py),
      // we draw actual boundary polygons and highlight the selected community.
      // Falls back to an approximate pin-on-outline map when it isn't found.

      function flattenGeometryToRings(geometry) {
        // Returns an array of rings, each ring an array of [lat, lng] pairs.
        if (!geometry) return [];
        if (geometry.type === "Polygon") {
          return geometry.coordinates.map((ring) => ring.map(([lng, lat]) => [lat, lng]));
        }
        if (geometry.type === "MultiPolygon") {
          const rings = [];
          geometry.coordinates.forEach((polygon) => {
            polygon.forEach((ring) => rings.push(ring.map(([lng, lat]) => [lat, lng])));
          });
          return rings;
        }
        return [];
      }

      async function loadBoundaries() {
        try {
          const response = await fetch(DEFAULT_BOUNDARIES_FILE, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const geojson = await response.json();

          const byId = new Map();
          let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;

          (geojson.features || []).forEach((feature) => {
            const props = feature.properties || {};
            const id = Number(props.id ?? props.ClusterNum);
            if (!Number.isFinite(id)) return;

            const rings = flattenGeometryToRings(feature.geometry);
            if (!rings.length) return;

            rings.forEach((ring) => {
              ring.forEach(([lat, lng]) => {
                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
                if (lng < minLng) minLng = lng;
                if (lng > maxLng) maxLng = lng;
              });
            });

            if (!byId.has(id)) byId.set(id, []);
            byId.get(id).push(...rings);
          });

          if (byId.size === 0) throw new Error("No usable features in GeoJSON");

          // Pad bounds by ~4% so shapes near the edge aren't clipped.
          const padLat = (maxLat - minLat) * 0.04;
          const padLng = (maxLng - minLng) * 0.04;

          state.boundaries = {
            byId,
            bounds: {
              minLat: minLat - padLat,
              maxLat: maxLat + padLat,
              minLng: minLng - padLng,
              maxLng: maxLng + padLng,
            },
          };

          console.info(`Loaded ${byId.size} community boundaries from ${DEFAULT_BOUNDARIES_FILE}.`);
          renderProfilePanel(); // re-render in case a profile is already open
        } catch (error) {
          state.boundaries = null;
          console.info(
            `Community boundaries not loaded (${error.message}). Using approximate placeholder map. ` +
              `Run convert_boundaries.py and place ${DEFAULT_BOUNDARIES_FILE} next to this HTML file for real shapes.`,
          );
        }
      }

      function projectToMap(lat, lng, width, height, bounds) {
        const x = ((lng - bounds.minLng) / (bounds.maxLng - bounds.minLng)) * width;
        const y = height - ((lat - bounds.minLat) / (bounds.maxLat - bounds.minLat)) * height;
        return [x, y];
      }

      function ringToPathPoints(ring, width, height, bounds) {
        return ring.map(([lat, lng]) => projectToMap(lat, lng, width, height, bounds));
      }

      function pointsToPathD(points) {
        return points.map(([x, y], i) => `${i === 0 ? "M" : "L"} ${x.toFixed(1)},${y.toFixed(1)}`).join(" ") + " Z";
      }

      // Simplified Nova Scotia outline (mainland + Cape Breton), placeholder shape
      // used only when no real boundary GeoJSON has been loaded.
      const NS_OUTLINE_PATH =
        "M 40,150 C 60,120 90,95 130,80 C 160,68 190,60 220,58 " +
        "C 245,56 265,62 285,72 C 300,80 305,95 300,108 " +
        "C 320,100 345,92 365,98 C 385,104 392,120 385,135 " +
        "C 400,132 415,140 418,155 C 420,168 410,180 396,182 " +
        "C 405,192 402,208 388,212 C 375,216 362,208 358,196 " +
        "C 340,205 318,210 298,204 C 288,222 270,238 248,242 " +
        "C 258,252 256,266 244,272 C 230,278 216,270 212,258 " +
        "C 190,268 165,270 145,260 C 125,250 112,232 110,212 " +
        "C 90,208 72,196 62,178 C 52,168 44,160 40,150 Z";

      function renderMiniMap(row, { width = 340, height = 260, forPrint = false } = {}) {
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", `Location of ${row.name} in Nova Scotia`);

        const bg = document.createElementNS(svgNS, "rect");
        bg.setAttribute("width", width);
        bg.setAttribute("height", height);
        bg.setAttribute("fill", forPrint ? "#ffffff" : "#eef2f0");
        svg.appendChild(bg);

        if (state.boundaries) {
          renderRealBoundaryMap(svg, row, width, height, forPrint);
        } else {
          renderPlaceholderMap(svg, row, width, height, forPrint);
        }

        const caption = document.createElementNS(svgNS, "text");
        caption.setAttribute("x", 8);
        caption.setAttribute("y", height - 8);
        caption.setAttribute("font-size", "8");
        caption.setAttribute("fill", forPrint ? "#999" : "#9a9688");
        caption.textContent = state.boundaries
          ? "Community boundary — Nova Scotia Community Clusters"
          : "Approximate location — placeholder map";
        svg.appendChild(caption);

        return svg;
      }

      function renderRealBoundaryMap(svg, row, width, height, forPrint) {
        const svgNS = "http://www.w3.org/2000/svg";
        const { byId, bounds } = state.boundaries;

        // Draw every community faintly for context, then highlight the selected one.
        byId.forEach((rings, id) => {
          const isSelected = id === row.id;
          if (isSelected) return; // draw selected one last, on top
          rings.forEach((ring) => {
            const points = ringToPathPoints(ring, width, height, bounds);
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", pointsToPathD(points));
            path.setAttribute("fill", forPrint ? "#f7f7f5" : "#dfe6e0");
            path.setAttribute("stroke", forPrint ? "#ccc" : "#c3cdc6");
            path.setAttribute("stroke-width", "0.6");
            svg.appendChild(path);
          });
        });

        const selectedRings = byId.get(row.id);
        if (selectedRings && selectedRings.length) {
          selectedRings.forEach((ring) => {
            const points = ringToPathPoints(ring, width, height, bounds);
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", pointsToPathD(points));
            path.setAttribute("fill", "#e35d3f");
            path.setAttribute("fill-opacity", "0.55");
            path.setAttribute("stroke", "#b8331a");
            path.setAttribute("stroke-width", "1.5");
            svg.appendChild(path);
          });

          // Label near the centroid of the largest ring.
          const largest = selectedRings.reduce((a, b) => (a.length > b.length ? a : b));
          const points = ringToPathPoints(largest, width, height, bounds);
          const cx = points.reduce((sum, p) => sum + p[0], 0) / points.length;
          const cy = points.reduce((sum, p) => sum + p[1], 0) / points.length;

          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", cx);
          label.setAttribute("y", cy);
          label.setAttribute("font-size", "9");
          label.setAttribute("font-weight", "700");
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("fill", forPrint ? "#333" : "#3a2018");
          label.textContent = row.name.length > 26 ? row.name.slice(0, 24) + "…" : row.name;
          svg.appendChild(label);
        } else {
          const notice = document.createElementNS(svgNS, "text");
          notice.setAttribute("x", width / 2);
          notice.setAttribute("y", height / 2);
          notice.setAttribute("font-size", "10");
          notice.setAttribute("text-anchor", "middle");
          notice.setAttribute("fill", "#9a9688");
          notice.textContent = "No boundary found for this community ID";
          svg.appendChild(notice);
        }
      }

      function renderPlaceholderMap(svg, row, width, height, forPrint) {
        const svgNS = "http://www.w3.org/2000/svg";

        const outline = document.createElementNS(svgNS, "path");
        outline.setAttribute("d", NS_OUTLINE_PATH);
        outline.setAttribute("transform", `scale(${width / 460}, ${height / 300})`);
        outline.setAttribute("fill", forPrint ? "#f4f4f2" : "#dce8e0");
        outline.setAttribute("stroke", forPrint ? "#999" : "#b7c9bd");
        outline.setAttribute("stroke-width", "1.5");
        svg.appendChild(outline);

        const coords = COMMUNITY_COORDS[row.id];
        if (!coords) return;

        const bounds = NS_BOUNDS;
        const [lat, lng] = coords;
        const [px, py] = projectToMap(lat, lng, width, height, bounds);

        const halo = document.createElementNS(svgNS, "circle");
        halo.setAttribute("cx", px);
        halo.setAttribute("cy", py);
        halo.setAttribute("r", 9);
        halo.setAttribute("fill", "#e35d3f");
        halo.setAttribute("opacity", "0.22");
        svg.appendChild(halo);

        const pin = document.createElementNS(svgNS, "circle");
        pin.setAttribute("cx", px);
        pin.setAttribute("cy", py);
        pin.setAttribute("r", 5);
        pin.setAttribute("fill", "#b8331a");
        pin.setAttribute("stroke", "#fff");
        pin.setAttribute("stroke-width", "1.5");
        svg.appendChild(pin);

        const label = document.createElementNS(svgNS, "text");
        label.setAttribute("x", px + 9);
        label.setAttribute("y", py - 8);
        label.setAttribute("font-size", "9");
        label.setAttribute("font-weight", "600");
        label.setAttribute("fill", forPrint ? "#333" : "#4a4a42");
        label.textContent = row.name.length > 26 ? row.name.slice(0, 24) + "…" : row.name;
        svg.appendChild(label);
      }

      function hviBandColor(value, domain) {
        const band = getBand(value, domain);
        return band === null ? "#efede7" : RAMPS.orange[band];
      }

      function setStatus(message, isError = false) {
        elements.status.textContent = message || "";
        elements.status.classList.toggle("visible", Boolean(message));
        elements.status.classList.toggle("error", Boolean(message) && isError);
      }

      function createElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function renderLegend() {
        const fragment = document.createDocumentFragment();
        const palette = getActivePalette();

        CATEGORIES.forEach((category) => {
          const item = createElement("div", "legend-item");
          item.appendChild(createElement("span", "legend-label", category.label));

          const swatches = createElement("div", "swatches");
          const color = getCategoryColor(category.key);
          palette.ramps[color].forEach((swatchColor) => {
            const swatch = createElement("div", "swatch");
            swatch.style.background = swatchColor;
            swatches.appendChild(swatch);
          });

          item.appendChild(swatches);
          item.appendChild(createElement("span", "legend-direction", "low to high"));
          fragment.appendChild(item);
        });

        elements.legend.replaceChildren(fragment);
      }

      function readWorkbook(arrayBuffer) {
        if (typeof XLSX === "undefined") {
          throw new Error("The Excel reader could not load. Check your internet connection and refresh the page.");
        }

        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];

        if (!worksheet) {
          throw new Error("The Excel file does not contain a worksheet.");
        }

        const worksheetRows = XLSX.utils.sheet_to_json(worksheet, {
          header: 1,
          defval: null,
          raw: true,
        });

        const headerIndex = worksheetRows.findIndex(
          (row) =>
            String(row[0] ?? "").trim().toLowerCase() === "id" &&
            String(row[1] ?? "").trim().toLowerCase() === "name",
        );

        if (headerIndex < 0) {
          throw new Error('The workbook must contain an "id" column and a "name" column.');
        }

        const headers = worksheetRows[headerIndex].map((value) =>
          String(value ?? "").trim(),
        );

        const requiredColumns = [
          ...ALL_COLUMNS.map(({ column }) => column),
          ...PROFILE_COLUMNS,
        ];
        const missingColumns = requiredColumns.filter(
          (column) => !headers.includes(column),
        );

        if (missingColumns.length) {
          throw new Error(`The workbook is missing these columns: ${missingColumns.join(", ")}.`);
        }

        const rows = worksheetRows
          .slice(headerIndex + 1)
          .filter((values) => values[0] !== null && values[1] !== null)
          .map((values) => {
            const row = {};

            headers.forEach((header, index) => {
              if (!header) return;

              const value = values[index];
              if (header === "name") {
                row[header] = String(value).trim();
              } else if (value === null || value === undefined || value === "") {
                row[header] = null;
              } else {
                const numericValue = Number(value);
                row[header] = Number.isFinite(numericValue) ? numericValue : value;
              }
            });

            return row;
          })
          .filter((row) => Number.isFinite(row.id) && row.name);

        if (!rows.length) {
          throw new Error("The workbook does not contain any community records.");
        }

        return rows;
      }

      function updateDomains() {
        state.domains = Object.fromEntries(
          ALL_COLUMNS.map(({ column }) => {
            const values = state.rows.map((row) => row[column]).filter(Number.isFinite);
            const domain = values.length
              ? { min: Math.min(...values), max: Math.max(...values) }
              : { min: 0, max: 0 };
            return [column, domain];
          }),
        );
      }

      function getSortedRows() {
        const rows = [...state.rows];
        const { column, direction } = getEffectiveSort();

        return rows.sort((first, second) => {
          const firstValue = first[column];
          const secondValue = second[column];

          if (firstValue === null || firstValue === undefined) return 1;
          if (secondValue === null || secondValue === undefined) return -1;

          const comparison =
            typeof firstValue === "string"
              ? firstValue.localeCompare(secondValue)
              : firstValue - secondValue;

          return direction === "asc" ? comparison : -comparison;
        });
      }

      function getBand(value, domain) {
        if (!Number.isFinite(value)) return null;
        if (domain.max === domain.min) return 2;

        const fraction = (value - domain.min) / (domain.max - domain.min);
        return Math.max(0, Math.min(4, Math.floor(fraction * 5)));
      }

      function handleSort(column) {
        if (state.sortColumn === column) {
          state.sortDirection = state.sortDirection === "desc" ? "asc" : "desc";
        } else {
          state.sortColumn = column;
          state.sortDirection = "desc";
        }

        renderTable();
      }

      function getEffectiveSort() {
        return {
          column: state.sortColumn || "name",
          direction: state.sortColumn ? state.sortDirection : "asc",
        };
      }

      function createHeader(label, column, className, accent) {
        const header = createElement("th", className);
        const { column: activeColumn, direction } = getEffectiveSort();
        const active = activeColumn === column;
        header.classList.toggle("active", active);
        header.title = `Sort by ${label}`;
        header.addEventListener("click", () => handleSort(column));

        if (accent) header.style.borderLeft = `2px solid ${getActivePalette().accentLines[accent]}`;

        const labelClass = className.includes("sticky") ? "" : "vertical-label";
        header.appendChild(createElement("span", labelClass, label));

        if (active) {
          const arrow = direction === "desc" ? "▼" : "▲";
          header.appendChild(createElement("span", "sort-arrow", arrow));
        }

        return header;
      }

      function renderTable() {
        const palette = getActivePalette();

        const headingRow = document.createElement("tr");
        headingRow.appendChild(createHeader("Community", "name", "sticky name-column"));

        ALL_COLUMNS.forEach(({ column, categoryKey, label }) => {
          const columnClass = SUMMARY_COLUMNS.has(column)
            ? "measure-column summary-column"
            : "measure-column";
          const color = getCategoryColor(categoryKey);
          headingRow.appendChild(createHeader(label || column, column, columnClass, color));
        });

        elements.tableHead.replaceChildren(headingRow);

        const fragment = document.createDocumentFragment();

        getSortedRows().forEach((row) => {
          const tableRow = document.createElement("tr");
          if (row.id === state.selectedId) tableRow.classList.add("row-selected");

          const nameCell = createElement("td", "sticky name-column", row.name);
          nameCell.title = `View profile for ${row.name}`;
          nameCell.addEventListener("click", () => selectCommunity(row.id));
          tableRow.appendChild(nameCell);

          ALL_COLUMNS.forEach(({ column, categoryKey }) => {
            const value = row[column];
            const band = getBand(value, state.domains[column]);
            const cell = createElement("td", "heat-cell");
            const color = getCategoryColor(categoryKey);

            cell.style.background = band === null ? "#efede7" : palette.ramps[color][band];
            const whiteFrom = palette.whiteTextFromBand[color];
            cell.style.color =
              band !== null && whiteFrom !== null && band >= whiteFrom ? "#fff" : "#2b2b26";

            tableRow.appendChild(cell);
          });

          fragment.appendChild(tableRow);
        });

        elements.tableBody.replaceChildren(fragment);
        elements.tableWrap.classList.add("visible");
      }

      // ---------- Community profile panel ----------

      function selectCommunity(id) {
        state.selectedId = state.selectedId === id ? null : id;
        renderTable();
        renderProfilePanel();
      }

      function closeProfile() {
        state.selectedId = null;
        renderTable();
        renderProfilePanel();
      }

      function buildSubindexList(row, container, forPrint) {
        const palette = getActivePalette();

        CATEGORIES.forEach((category) => {
          if (category.key === "hvi-normalized") return;

          const heading = createElement(
            "div",
            forPrint ? "print-section-title" : "profile-category-heading",
            category.label,
          );
          container.appendChild(heading);

          const list = createElement("div", forPrint ? "print-subindex-list" : "profile-subindex-list");
          const color = getCategoryColor(category.key);

          category.columns.forEach((column) => {
            const value = row[column];
            const band = getBand(value, state.domains[column]);
            const rowEl = createElement("div", forPrint ? "print-subindex-row" : "subindex-row");

            rowEl.appendChild(createElement("span", "subindex-name", column));

            const track = createElement("div", "subindex-track");
            const fill = createElement("div", "subindex-fill");
            const pct = Number.isFinite(value) ? Math.round(value * 100) : 0;
            fill.style.width = `${pct}%`;
            fill.style.background = band === null ? "#ccc" : palette.ramps[color][band];
            track.appendChild(fill);
            rowEl.appendChild(track);

            rowEl.appendChild(
              createElement("span", "subindex-val", formatIndexValue(value)),
            );

            list.appendChild(rowEl);
          });

          container.appendChild(list);
        });
      }

      function renderProfilePanel() {
        const row = state.rows.find((r) => r.id === state.selectedId);

        if (!row) {
          elements.profilePanel.classList.remove("open");
          elements.profilePanelInner.replaceChildren();
          return;
        }

        elements.profilePanel.classList.add("open");

        const stats = getCommunityStats(row);

        const inner = document.createDocumentFragment();

        const closeBtn = createElement("button", "profile-close", "✕");
        closeBtn.type = "button";
        closeBtn.title = "Close profile";
        closeBtn.addEventListener("click", closeProfile);
        inner.appendChild(closeBtn);

        const header = createElement("div", "profile-header");
        header.appendChild(createElement("h2", "profile-name", row.name));
        inner.appendChild(header);

        const mapBox = createElement("div", "profile-map");
        mapBox.appendChild(renderMiniMap(row, { width: 340, height: 220 }));
        inner.appendChild(mapBox);

        inner.appendChild(createElement("div", "profile-section-title", "Community snapshot"));

        const statsGrid = createElement("div", "profile-stats");
        const statDefs = [
          ["HVI*", formatIndexValue(row["Normalized HVI"]), "", true],
          ["Population", formatPopulation(stats.population), "", false],
          ["Area", formatArea(stats.areaKm2), "km²", false],
        ];

        statDefs.forEach(([label, value, unit, emphasize]) => {
          const box = createElement("div", emphasize ? "stat-box stat-box-emphasis" : "stat-box");
          box.appendChild(createElement("div", "stat-label", label));
          const valueLine = createElement("div", "stat-value", value);
          if (unit) valueLine.appendChild(createElement("span", "stat-unit", unit));
          box.appendChild(valueLine);
          statsGrid.appendChild(box);
        });

        inner.appendChild(statsGrid);

        inner.appendChild(createElement("div", "profile-section-title", "Sub-index scores"));
        buildSubindexList(row, inner, false);

        const printBtn = createElement("button", "print-profile-btn", "🖨  Print community profile");
        printBtn.type = "button";
        printBtn.addEventListener("click", () => printProfile(row, stats));
        inner.appendChild(printBtn);

        elements.profilePanelInner.replaceChildren(inner);
      }

      function printProfile(row, stats) {
        const root = document.createDocumentFragment();

        const header = createElement("div", "print-header");
        const titleBlock = document.createElement("div");
        titleBlock.appendChild(createElement("h1", null, row.name));
        titleBlock.appendChild(
          createElement("div", "print-meta", "Nova Scotia Heat Vulnerability Index — Community Profile"),
        );
        header.appendChild(titleBlock);
        root.appendChild(header);

        const grid = createElement("div", "print-grid");

        const left = document.createElement("div");
        const mapBox = createElement("div", "print-map-box");
        mapBox.appendChild(renderMiniMap(row, { width: 340, height: 240, forPrint: true }));
        left.appendChild(mapBox);

        const right = document.createElement("div");
        right.appendChild(createElement("div", "print-section-title", "Community snapshot"));
        const statsGrid = createElement("div", "print-stats");
        const statDefs = [
          ["HVI*", formatIndexValue(row["Normalized HVI"]), true],
          ["Population", formatPopulation(stats.population), false],
          ["Area (km²)", formatArea(stats.areaKm2), false],
        ];
        statDefs.forEach(([label, value, emphasize]) => {
          const box = createElement("div", emphasize ? "print-stat print-stat-emphasis" : "print-stat");
          box.appendChild(createElement("div", "stat-label", label));
          box.appendChild(createElement("div", "stat-value", value));
          statsGrid.appendChild(box);
        });
        right.appendChild(statsGrid);

        grid.appendChild(left);
        grid.appendChild(right);
        root.appendChild(grid);

        const subindexWrap = document.createElement("div");
        buildSubindexList(row, subindexWrap, true);
        root.appendChild(subindexWrap);

        root.appendChild(
          createElement(
            "div",
            "print-footer",
            "",
          ),
        );

        elements.printRoot.replaceChildren(root);

        // Most browsers suggest the document <title> as the default filename
        // when saving the print output as PDF. Temporarily rename it to a
        // "Title - Community" combination, then restore afterwards.
        const originalTitle = document.title;
        const safeName = row.name.replace(/[\\/:*?"<>|]/g, "").trim();
        document.title = `HVI Community Profile - ${safeName}`;

        const restoreTitle = () => {
          document.title = originalTitle;
          window.removeEventListener("afterprint", restoreTitle);
        };
        window.addEventListener("afterprint", restoreTitle);

        window.print();

        // Fallback in case afterprint doesn't fire (some browsers/print-preview flows).
        setTimeout(restoreTitle, 2000);
      }

      function displayWorkbook(arrayBuffer) {
        state.rows = readWorkbook(arrayBuffer);
        state.sortColumn = null;
        state.sortDirection = "desc";
        state.selectedId = null;
        updateDomains();
        renderTable();
        renderProfilePanel();
        setStatus("");
      }

      async function loadDefaultWorkbook() {
        if (typeof XLSX === "undefined") {
          setStatus("The Excel reader could not load. Connect to the internet and refresh this page.", true);
          return;
        }

        if (window.location.protocol === "file:") {
          setStatus(
            "Automatic Excel loading requires a local web server. Open this page at http://localhost:8000/hvi_heatmap.html.",
            true,
          );
          return;
        }

        setStatus(`Looking for ${DEFAULT_EXCEL_FILE}...`);

        try {
          const response = await fetch(DEFAULT_EXCEL_FILE, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          displayWorkbook(await response.arrayBuffer());
        } catch (error) {
          setStatus(
            `Could not load ${DEFAULT_EXCEL_FILE}. Keep the HTML file and the Excel file in the same folder.`,
            true,
          );
        }
      }

      state.paletteId = loadStoredPaletteId();
      updatePaletteToggleUI();
      renderLegend();
      loadDefaultWorkbook();
      loadBoundaries();
    </script>
  </body>
</html>
